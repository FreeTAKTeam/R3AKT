openapi: 3.1.0
info:
  title: R3AKT ATAK/CoT Gateway API
  version: 0.1.0
  description: Contract-first API for configuring and operating the CoT gateway auxiliary service.
servers:
  - url: http://localhost:8102
tags:
  - name: config
  - name: bridge
paths:
  /config:
    get:
      tags: [config]
      summary: Get gateway configuration
      operationId: getConfig
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    put:
      tags: [config]
      summary: Set gateway configuration
      operationId: setConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated
  /bridge/status:
    get:
      tags: [bridge]
      summary: Bridge status
      operationId: getBridgeStatus
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  last_cot_rx: { type: string, format: date-time }
                  last_lxmf_tx: { type: string, format: date-time }
