openapi: 3.1.0
info:
  title: R3AKT Analytics Service API
  version: 0.1.0
  description: Contract-first API for the Analytics/Aggregation auxiliary service.
servers:
  - url: http://localhost:8101
tags:
  - name: jobs
  - name: reports
paths:
  /jobs:
    post:
      tags: [jobs]
      summary: Create an analytics job
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                topics:
                  type: array
                  items: { type: string }
                window_seconds: { type: integer, minimum: 0 }
                outputs:
                  type: array
                  items: { type: string }
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
  /jobs/{job_id}:
    get:
      tags: [jobs]
      summary: Get job status
      operationId: getJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  status: { type: string }
                  progress: { type: number, minimum: 0.0, maximum: 1.0 }
  /reports/{report_id}:
    get:
      tags: [reports]
      summary: Fetch a generated report
      operationId: getReport
      parameters:
        - name: report_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
